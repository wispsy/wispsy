name: Release package
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - run: git merge-base --is-ancestor HEAD origin/main
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.9'
          python-version: '3.14'
      - run: uv build --out-dir dist
      - name: Validate selected release identity and payload
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: uv run --no-project python scripts/check_release.py dist --tag "$RELEASE_TAG"
      - run: uv run --no-project python scripts/check_distribution.py dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-receipt
          path: release-artifacts.json
          if-no-files-found: error
  qualify:
    name: Qualify installed ${{ matrix.profile }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: workflow
            python: '3.11'
            command: python scripts/qualify.py dist --profile workflow
          - profile: composition
            python: '3.14'
            command: python scripts/qualify.py dist --profile composition
          - profile: family
            python: '3.14'
            command: python scripts/qualify_family.py dist
          - profile: homegrown
            python: '3.14'
            command: python scripts/qualify_hero.py dist
          - profile: session
            python: '3.14'
            command: python scripts/qualify_session.py dist
          - profile: application
            python: '3.14'
            command: python scripts/qualify_application.py dist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.13.9'
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-distributions
          path: dist
      - run: uv run --no-project ${{ matrix.command }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: qualification-${{ matrix.profile }}
          path: '*-qualification.json'
          if-no-files-found: ignore
  publish:
    name: Publish qualified release
    needs: [build, qualify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/wispsy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
