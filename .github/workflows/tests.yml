name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
            profile: workflow
          - os: ubuntu-latest
            python: '3.14'
            profile: composition
          - os: macos-latest
            python: '3.14'
            profile: composition
          - os: windows-latest
            python: '3.11'
            profile: workflow
          - os: windows-latest
            python: '3.14'
            profile: composition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and inspect distributions
        run: |
          python -m pip install uv
          uv build --out-dir dist
          python scripts/check_distribution.py dist
      - name: Qualify installed wheel and source profiles
        run: python scripts/qualify.py dist --profile ${{ matrix.profile }}

  family:
    name: Installed family (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv build --out-dir dist
      - run: python scripts/qualify_family.py dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: family-${{ matrix.os }}
          path: family-qualification.json
          if-no-files-found: error

  hero:
    name: Installed homegrown (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv build --out-dir dist
      - run: python scripts/qualify_hero.py dist
