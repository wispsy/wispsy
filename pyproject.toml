[project]
name = "wispsy"
version = "0.0.1.dev0"
description = "Executable references for explicit Python capability composition."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ellainng" }]
dependencies = []

[project.optional-dependencies]
workflow = ["hidden-moves @ git+https://github.com/wispsy/hidden_moves.git@e0c89ebcd7f6b524fc0e365839046d8af0ed269a"]

[project.scripts]
wispsy-reference = "wispsy.reference:main"

[project.entry-points."hidden_moves.moves"]
wispsy-reference = "wispsy.integration:provide_moves"

[project.urls]
Source = "https://github.com/wispsy/wispsy"
Issues = "https://github.com/wispsy/wispsy/issues"
Project = "https://github.com/orgs/wispsy/projects/23"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["IMPLEMENTATION_PLAN.md", "docs/*.md", "scripts/*.py", "tests/*.py", "integration_tests/*.py"]
