[project]
name = "wispsy"
version = "0.0.1.dev0"
description = "Executable references for explicit Python capability composition."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ellainng" }]
dependencies = []

[project.optional-dependencies]
workflow = ["hidden-moves @ git+https://github.com/wispsy/hidden_moves.git@8a3d246b0770e6ee103f0de1bf41c913ff9f4051"]
sequence = [
    "hidden-moves @ git+https://github.com/wispsy/hidden_moves.git@8a3d246b0770e6ee103f0de1bf41c913ff9f4051",
    "func-seq @ git+https://github.com/wispsy/func_seq.git@b1a5346feeeef3fa1f398e4dcd81c2d23345386c ; python_version >= '3.14'",
]

[project.scripts]
wispsy-reference = "wispsy.reference:main"

[project.entry-points."hidden_moves.moves"]
wispsy-reference = "wispsy.integration:provide_moves"

[project.urls]
Source = "https://github.com/wispsy/wispsy"
Issues = "https://github.com/wispsy/wispsy/issues"
Project = "https://github.com/orgs/wispsy/projects/23"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["IMPLEMENTATION_PLAN.md", "docs/*.md", "scripts/*.py", "tests/*.py", "integration_tests/*.py", "lifecycle_tests/*.py"]
