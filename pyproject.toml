[project]
name = "wispsy"
version = "0.1.0a1"
description = "Executable references for explicit Python capability composition."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
authors = [{ name = "ellainng" }]
dependencies = []

[project.optional-dependencies]
application = ["hypnosis[application,models]==0.1.0a1 ; python_version >= '3.14'"]
workflow = ["hidden-moves==0.1.1"]
sequence = [
    "hidden-moves==0.1.1",
    "func-seq==0.1.0 ; python_version >= '3.14'",
]
table = [
    "moveset==0.1.0",
    "headless-spreadsheets==0.1.1 ; python_version >= '3.14'",
]
scripting = ["scriptty[cli]==0.1.0"]
terminal = ["scriptty[terminal]==0.1.0 ; python_version >= '3.14'"]

family = [
    "hypnosis[models]==0.1.0a1 ; python_version >= '3.14'",
    "paracosm==0.1.0a1 ; python_version >= '3.14'",
    "compose-application==0.1.0a1 ; python_version >= '3.14'",
]

[project.scripts]
wispsy-reference = "wispsy.reference:main"

[project.entry-points."hidden_moves.moves"]
wispsy-reference = "wispsy.integration:provide_moves"

[project.urls]
Source = "https://github.com/wispsy/wispsy"
Issues = "https://github.com/wispsy/wispsy/issues"
Project = "https://github.com/orgs/wispsy/projects/23"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["docs/releases/*.md", "docs/releases/*.json", "IMPLEMENTATION_PLAN.md", "docs/*.md", "docs/cohesion-block-b/*.md", "docs/cohesion-block-b/*.json", "docs/cohesion-block-b/*.jsonl", "scripts/*.py", "tests/*.py", "integration_tests/*.py", "lifecycle_tests/*.py", "table_tests/*.py", "composition_tests/*.py", "family_tests/*.py", "hero_tests/*.py", "session_tests/*.py", "application_tests/*.py"]
